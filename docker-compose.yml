services:
  db:
    image: postgres:15-alpine
    container_name: helpdesk_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - helpdesk_network

  api:
    build: ./backend
    container_name: helpdesk_api
    restart: always
    environment:
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db # O nome do contêiner do banco
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - helpdesk_network
    volumes:
      - ./backend:/app
networks:
  helpdesk_network:
    driver: bridge

volumes:
  pgdata:
